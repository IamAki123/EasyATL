plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group = 'com.github.IamAki123'
version = '1.1.0'

android {
    namespace 'org.firstinspires.ftc.easyatl'
    compileSdk 34
    defaultConfig { minSdk 24 }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

// Compile against the FTC Vision API without bundling it. The Robot Controller app supplies
// these classes at runtime. Depending on :FtcRobotController does not expose its implementation
// dependencies to another library module.
dependencies {
    compileOnly 'org.firstinspires.ftc:Vision:11.1.0'
    compileOnly 'org.firstinspires.ftc:RobotCore:11.1.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'EasyATL'
                version = project.version
            }
        }
    }
}
